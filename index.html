<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>💘 Eine wichtige Frage 💘</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;      /* horizontal kein scroll */
      overflow-y: auto;        /* vertikal scroll erlauben */
      padding: 22px 0;         /* damit oben/unten Luft ist */
    }

    .card {
      background: rgba(255,255,255,0.93);
      border-radius: 26px;
      padding: 28px 24px;
      text-align: center;
      width: min(560px, 92vw);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      position: relative;
      z-index: 2;
      margin: 0 12px;
    }

    h1 {
      margin-top: 0;
      font-size: clamp(22px, 5vw, 32px);
    }

    p {
      font-size: 16px;
      opacity: 0.88;
      margin: 10px 0;
    }

    .timer {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.85;
      background: rgba(0,0,0,0.05);
      display: inline-block;
      padding: 10px 14px;
      border-radius: 14px;
    }
    .timer strong { opacity: 1; }

    .buttons {
  position: relative;
  margin-top: 22px;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;

  min-height: 70px; /* Platz für springenden Nein-Button */
}

    }

    button {
      font-size: 18px;
      padding: 14px 20px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform .12s ease, opacity .12s ease;
    }

    #yes {
      background: #22c55e;
      color: white;
    }

    #no {
      background: #ef4444;
      color: white;
      position: absolute;
      left: 55%;
      top: 0;
      transform-origin: center;
    }

    .result {
      display: none;
      margin-top: 22px;
      animation: pop .4s ease;
    }

    @keyframes pop {
      from { transform: scale(.9); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .love-note {
      margin-top: 10px;
      font-size: 15px;
      opacity: 0.9;
      line-height: 1.4;
    }

    .photo {
      margin-top: 16px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 35px rgba(0,0,0,.25);
    }

    .photo img {
      width: 100%;
      display: block;
    }

    /* Herzen */
    .heart {
      position: fixed;
      font-size: 20px;
      animation: floatUp 2.5s ease forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to   { transform: translateY(-140px) scale(1.6); opacity: 0; }
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- Optional: Sound. Wenn yay.mp3 fehlt, läuft trotzdem alles. -->
<audio id="yaySound" src="yay.mp3" preload="auto"></audio>

<div class="card">
  <h1>Hey schatz 💕</h1>
  <p><strong>Willst du mein Valentinstag-Date sein, schatz?</strong></p>

  <!-- Zeitelement -->
  <div class="timer" id="timer">
    ⏳ Lade Countdown…
  </div>

  <div class="buttons" id="arena">
    <button id="yes">Ja 😍</button>
    <button id="no">Nein 🙃</button>
  </div>

  <div class="result" id="result">
    <h2>YAAAIIII 😍💘</h2>

    <!-- Punkt 4: Zusätzlicher Text -->
    <div class="love-note" id="loveNote">
      Auch wenn wir momentan weit voneinander entfernt sind, bist du jeden Moment ganz tief in meinem Herzen. Ich liebe dich schatz 💘
    </div>

    <div class="photo" id="photoBlock">
      <!-- Bildname exakt wie in Git: ja.jpeg -->
      <img src="ja.jpeg" alt="Wir zwei 💕">
    </div>

    <p style="font-size:12px; opacity:.6; margin-top:10px;">
      (Der Nein-Button hatte nie eine echte Chance 😌)
    </p>
  </div>
</div>

<script>
  /***********************
   * ⭐️ EASY SETTINGS ⭐️
   ***********************/
  // Datum/Zeit deines "Dates" für den Countdown:
  // Format: new Date(JAHR, MONAT-1, TAG, STUNDE, MINUTE)
  // Beispiel: 14. Feb 2026, 19:00
  const targetDate = new Date(2026, 2, 10, 7, 0);
  
  // ⏱ Timer-Text (NUR HIER ÄNDERN)
const timerText = ({ days, hours, mins }) =>
  `⏳ Noch <strong>${days}</strong> Tage, <strong>${hours}</strong> Std, <strong>${mins}</strong> Min bis wir uns wieder sehen 💖`;

  // Text unter "Ja" (du kannst hier alles reinschreiben)
  const customLoveText = `Auch wenn wir momentan weit voneinander entfernt sind, bist du jeden Moment ganz tief in meinem Herzen. Ich liebe dich schatz 💘`;

  // Wie stark soll "Nein" schrumpfen pro Ausweichversuch?
  const shrinkPerEvade = 0.05;  // 0.03 = langsamer, 0.06 = schneller
  const minNoScale = 0.10;       // nie kleiner als 10%

  /***********************
   * DOM
   ***********************/
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const arena = document.getElementById("arena");
  const result = document.getElementById("result");
  const photoBlock = document.getElementById("photoBlock");
  const timerEl = document.getElementById("timer");
  const loveNote = document.getElementById("loveNote");
  const sound = document.getElementById("yaySound");

  loveNote.textContent = customLoveText;

  /***********************
   * Nein-Button: immer schneller + wird kleiner
   ***********************/
  let difficulty = 1;
  let lastMove = 0;
  let noScale = 1;

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  function placeNo(x = null, y = null) {
    const r = arena.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();
    const maxX = Math.max(0, r.width - b.width);
    const maxY = Math.max(0, r.height - b.height);

    noBtn.style.left = (x ?? Math.random() * maxX) + "px";
    noBtn.style.top  = (y ?? Math.random() * maxY) + "px";
  }

  function shrinkNoBtn() {
    noScale = clamp(noScale - shrinkPerEvade, minNoScale, 1);
    noBtn.style.transform = `scale(${noScale})`;
  }

  function evade(px, py) {
    const now = performance.now();
    const cooldown = Math.max(0, 120 - difficulty * 6);
    if (now - lastMove < cooldown) return;
    lastMove = now;

    difficulty += 0.35;      // unendlich schneller
    shrinkNoBtn();           // Punkt 2: kleiner werden

    const r = arena.getBoundingClientRect();
    const b = noBtn.getBoundingClientRect();
    const minDist = 110 + difficulty * 10;

    let x, y;
    for (let i = 0; i < 50; i++) {
      x = Math.random() * Math.max(1, (r.width - b.width));
      y = Math.random() * Math.max(1, (r.height - b.height));
      const cx = r.left + x + b.width / 2;
      const cy = r.top  + y + b.height / 2;
      if (Math.hypot(cx - px, cy - py) > minDist) break;
    }
    placeNo(x, y);
  }

  noBtn.addEventListener("mouseenter", e => evade(e.clientX, e.clientY));
  noBtn.addEventListener("mousemove",  e => evade(e.clientX, e.clientY));
  noBtn.addEventListener("touchstart", e => {
    const t = e.touches[0];
    evade(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  /***********************
   * Ja: Ergebnis anzeigen + Konfetti + Herzen + Auto-Scroll
   ***********************/
  yesBtn.addEventListener("click", async () => {
    result.style.display = "block";
    yesBtn.disabled = true;
    noBtn.disabled = true;
    yesBtn.style.opacity = 0.75;
    noBtn.style.opacity = 0.75;

    // optional Sound (läuft nur wenn Datei existiert & Browser es erlaubt)
    try {
      sound.currentTime = 0;
      await sound.play();
    } catch (e) {
      // kein Sound vorhanden oder Browser blockt -> egal, alles läuft weiter
    }

    startConfetti();
    spawnHearts();

    // Punkt 1: sanft zum Ergebnis/Bild scrollen
    // (kleiner Timeout, damit das Result erstmal gerendert wird)
    setTimeout(() => {
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 120);
  });

  // initial position
  placeNo();

  /***********************
   * Zeitelement (Punkt 5): Countdown
   ***********************/
  function formatCountdown(ms) {
    const totalSec = Math.floor(ms / 1000);
    const days = Math.floor(totalSec / (24*3600));
    const hours = Math.floor((totalSec % (24*3600)) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);

    // extra: Sekunden optional
    // const secs = totalSec % 60;

    return { days, hours, mins };
  }

  function updateTimer() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      timerEl.innerHTML = `💘 <strong>Heute ist unser Date-Tag!</strong> 💘`;
      return;
    }

    const t = formatCountdown(diff);
      timerEl.innerHTML = timerText(t);
  }

  updateTimer();
  setInterval(updateTimer, 1000 * 30); // alle 30s reicht völlig

  /***********************
   * Konfetti
   ***********************/
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  function startConfetti() {
    const pieces = Array.from({length: 170}, () => ({
      x: Math.random() * innerWidth,
      y: -20,
      vy: 2 + Math.random() * 4,
      vx: -1 + Math.random() * 2,
      r: 3 + Math.random() * 4,
      h: Math.random() * 360
    }));

    const start = performance.now();
    const duration = 3200;

    function tick(t) {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        ctx.fillStyle = `hsl(${p.h} 90% 70%)`;
        ctx.fillRect(p.x, p.y, p.r, p.r);
      });

      if ((t - start) < duration && pieces.some(p => p.y < innerHeight + 40)) {
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0,0,canvas.width,canvas.height);
      }
    }
    requestAnimationFrame(tick);
  }

  /***********************
   * Herzen
   ***********************/
  function spawnHearts() {
    for (let i = 0; i < 26; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = (70 + Math.random() * 10) + "vh";
      heart.style.animationDelay = (Math.random() * 0.5) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2600);
    }
  }
</script>

</body>
</html>
